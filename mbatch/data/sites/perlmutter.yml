default_constraint: cpu
default_part: None
default_qos: regular
default_account: None
architecture:
  cpu:                       # Perlmutter CPU
    None:
      cores_per_node: 128
      threads_per_core: 2
      memory_per_node_gb: 503
  gpu:                       # Perlmutter GPU (host CPU + 4x A100)
    None:
      cores_per_node: 64
      threads_per_core: 2
      memory_per_node_gb: 256
template: |
  #!/bin/bash!CONSTRAINT!QOS!PARTITION!ACCOUNT
  #SBATCH --nodes=!NODES
  #SBATCH --ntasks=!TASKS
  #SBATCH --time=!WALL
  #SBATCH --job-name=!JOBNAME
  #SBATCH --cpus-per-task=!HYPERTHREADS
  #SBATCH --output=!OUT_%j.txt
  #SBATCH --mail-type=FAIL
  #SBATCH --mail-user=

  !ENV

  !EXTRA

  !LAUNCH

env: |
  export DISABLE_MPI=false

  module load python

launcher: |
  export OMP_PROC_BIND=spread
  export OMP_PLACES=threads
  export OMP_PLACES=threads
  export OMP_NUM_THREADS=!THREADS
  srun !NPFLAG !CPTFLAG --cpu-bind=cores !CMD
